name: thai-please
services:
  db:
    image: mysql:8.4
    # Without this the init client reads thai_please_schema.sql as latin1 and the seed Thai text is stored double-encoded.
    command: --character-set-client-handshake=false --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-change-me}
      MYSQL_DATABASE: thai_please
      MYSQL_USER: thai_please
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-demo-change-me}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./thai_please_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h localhost -u root -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30
  backend:
    build: ./backend
    environment:
      DATABASE_URL: mysql://thai_please:${MYSQL_PASSWORD:-local-demo-change-me}@db:3306/thai_please
      JWT_SECRET: ${JWT_SECRET:-local-only-change-this-secret-before-sharing}
      DEMO_MODE: 'true'
      PORT: 5000
      TYPHOON_API_KEY: ${TYPHOON_API_KEY:-}
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build: ./frontend
    ports: ['8080:80']
    depends_on: [backend]
  phpmyadmin:
    image: phpmyadmin:5
    environment:
      PMA_HOST: db
      PMA_USER: thai_please
      PMA_PASSWORD: ${MYSQL_PASSWORD:-local-demo-change-me}
    ports: ['8081:80']
    depends_on:
      db: {condition: service_healthy}
volumes:
  mysql-data:
