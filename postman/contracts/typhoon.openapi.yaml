openapi: 3.0.3
info:
  title: Typhoon Chat Completion boundary used by THAI Please
  version: 1.0.0
  description: Local test contract inferred from the existing SDK adapter; not a provider-owned specification.
servers:
  - url: https://api.opentyphoon.ai/v1
paths:
  /chat/completions:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages]
              properties:
                model: {type: string}
                messages: {type: array, items: {type: object}}
      responses:
        '200':
          description: SDK completion envelope with JSON text in message.content
          content:
            application/json:
              example:
                choices:
                  - finish_reason: stop
                    message: {role: assistant, content: '{"cells":[]}'}
        '429':
          description: Rate limited
          content:
            application/json:
              example: {error: {message: Rate limited, type: rate_limit_error}}
